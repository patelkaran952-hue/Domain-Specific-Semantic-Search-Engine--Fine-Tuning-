# Phase 4 training configs, PREPARED in Phase 3 (nothing has been trained). Two comparable experiments:
# they share every hyperparameter below and differ ONLY in data file / columns.
training:
  base_model: sentence-transformers/all-MiniLM-L6-v2
  base_revision: 1110a243fdf4706b3f48f1d95db1a4f5529b4d41
  max_seq_length: 256
  epochs: 2                     # 1-2 per project plan; adjust only after profiling
  batch_size: 8                 # CPU / 8 GB RAM; note only batch_size-1 in-batch negatives per anchor
  learning_rate: 2.0e-5
  warmup_ratio: 0.1
  weight_decay: 0.01
  seed: 42
  num_workers: 0                # Windows
  batch_sampler: no_duplicates  # BatchSamplers.NO_DUPLICATES: no repeated texts within a batch -> no false in-batch negatives
  loss: MultipleNegativesRankingLoss
  evaluate_on: val              # validation queries only; test.tsv is not used for training or checkpoint selection
  output_dir: artifacts/models

experiments:
  positive_only:
    run_id: ft_pos_only
    data_file: data/mining/train_positive_pairs.jsonl
    columns: [anchor, positive]
    uses_mined_negatives: false
  hard_negative:
    run_id: ft_hardneg_dense
    data_file: data/mining/train_triplets_dense.jsonl     # switch to *_bm25.jsonl to use lexical negatives
    columns: [anchor, positive, negative]                 # MNRL consumes the explicit negative as a third column
    uses_mined_negatives: true
    negative_source: dense
    caveat: "Mined negatives are UNJUDGED top-ranked documents; some are likely false negatives."
